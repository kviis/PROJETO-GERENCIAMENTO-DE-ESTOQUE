<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="front.js" defer></script>

    <title>dashbord</title>

</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="kvs">KVS</span><span class="flow">FLOW</span><span class="by">by KVIIS</span></div>
    <h2>Painel de Monitoramento</h2>
    <ul><li onclick="telaInicio()">Início</li><li onclick="telaEntradaEsaidas()">Entradas e Saídas</li><li onclick="telaEstoque()">Estoque</li><li onclick="telaCadastro()">Cadastrar</li></ul>
  </aside>
  </div>

  <div class="main">
    <div class="caixa-logalt">
        <input type="image" name="conta" id="conta" src="" alt="fotoPerfil">
        <input type="button" id="sair" value="sair" onclick="sairConta()">
    </div>

    <div class="box-dashboard">
        <h1>Painel de controle</h1>
    </div>

    <div class="cards">
        <div class="card">
            <h3>Produtos</h3>
            <p id="totalProdutos">0</p>
        </div>

        <div class="card">
            <h3>Itens em estoque</h3>
            <p id="totalestoque">0</p>
        </div>

        <div class="card">
            <h3>Entradas</h3>
            <p id="totalEntradas">0</p>
        </div>

        <div class="card">
            <h3>Saídas</h3>
            <p id="totalsaidas">0</p>
        </div>
    </div>

    <div class="grafico-compradores">
        <div class="grafico-topo">
            <h2>Frequência de compradores</h2>

            <select id="filtroCompradores" onchange="carregarGraficoCompradores()">
                <option value="totalCompras">Quantidade de compras</option>
                <option value="totalItens">Total de itens comprados</option>
            </select>
        </div>

        <div id="listaCompradores" class="lista-compradores">
            <p>Carregando dados...</p>
        </div>
    </div>
</div>
</body>
</html>
