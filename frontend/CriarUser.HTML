<!DOCTYPE html>
<html lang="pt-br">
   <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="style.css">
     <script src="front.js" defer></script>
     <title>Criar Usuario</title>
   </head>
<body>  
    <div class="box-criar-user">
       <h1>Criar Login</h1>
        <div class="ultilitarios">
            <input type="email" id="novo-email" placeholder="email">
        </div> 
        <div class="ultilitarios">
            <input type="password" id="nova-senha" placeholder="senha">
        </div>
        <div class="ultilitarios">
            <input type="password" id="confirmar-senha" placeholder="confirmar senha">
        </div>
        <div class="ultilitarios">
            <button id="create-user">Criar</button>
        </div>
        <p id="resultado-criar"></p>
    </div>
</body>
</html>
