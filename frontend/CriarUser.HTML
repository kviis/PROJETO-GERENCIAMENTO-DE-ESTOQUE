<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">

  <title>KVS FLOW - Criar usuário</title>

  <link rel="stylesheet" href="style.css">
  <script src="front.js" defer></script>
</head>

<body class="criar-user-page">

 <main class="login-layout">
    <section class="login-brand" aria-label="KVS FLOW">
      <img src="img/logo-kvs-flow.png" alt="KVS FLOW - Sistema de Estoque" class="logo-login">
      <p>Gestão de estoque</p>
      <span>BY KVIIS</span>
    </section>

    <section class="criar-user-wrapper">

      <div class="box-criar-user">

        <div class="titulo">
          <h1>Criar conta</h1>
          <p>Cadastre um novo usuário</p>
        </div>

        <input
          type="email"
          id="novo-email"
          placeholder="E-mail"
          autocomplete="email">

        <input
          type="password"
          id="nova-senha"
          placeholder="Senha"
          autocomplete="new-password">

        <input
          type="password"
          id="confirmar-senha"
          placeholder="Confirmar senha"
          autocomplete="new-password">

        <button
          type="button"
          id="create-user">
          Criar
        </button>

        <div id="resultado-criar"></div>

        <div class="voltar-login">
          <a href="index.html">
            Voltar para o login
          </a>
        </div>

      </div>

    </section>

  </main>

</body>

</html>
