<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>KVS FLOW - Cadastro</title><link rel="stylesheet" href="style.css"><script src="front.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="kvs">KVS</span><span class="flow">FLOW</span><span class="by">by KVIIS</span></div>
    <h2>Painel de Monitoramento</h2>
    <ul><li onclick="telaInicio()">Início</li><li onclick="telaEntradaEsaidas()">Entradas e Saídas</li><li onclick="telaEstoque()">Estoque</li><li onclick="telaCadastro()">Cadastrar</li></ul>
  </aside>
  <main class="main">
    <div class="caixa-logalt"><input type="button" id="sair" value="Sair" onclick="sairConta()"></div>
    <div class="page-heading"><h1>Cadastro</h1><p>Inclua um novo produto no estoque</p></div>
    <section class="box-cadastro">
      <div class="cabecalho-cadastro"><h1>Cadastro de Produto</h1><p>Preencha os dados abaixo</p></div>
      <div class="Ultilitarios"><label for="cad-nome">Produto</label><input type="text" id="cad-nome" placeholder="Nome do produto"></div>
      <div class="Ultilitarios"><label for="cad-quantidade">Quantidade</label><input type="number" id="cad-quantidade" min="1" placeholder="Quantidade"></div>
      <div class="Ultilitarios"><label for="cad-validade">Validade</label><input type="date" id="cad-validade"></div>
      <div class="cadastrar-buttom"><button type="button" id="cadastrar-buttom">Cadastrar Produto</button></div>
      <p id="resultado-cadastro"></p>
    </section>
  </main>
</body>
</html>
